name: Robot de noticias WWF

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:                       # corre también apenas se sube un cambio al robot o a la app
    branches: [main]
    paths: ["scripts/**", "index.html", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  traer-noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer noticias reales
        run: node scripts/robot.mjs

      - name: Guardar si hay novedades
        run: |
          if git diff --quiet -- data/noticias.json; then
            echo "Nada nuevo."
            exit 0
          fi
          git config user.name "robot-naturaleza"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json
          git commit -m "Noticias al día $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora Colombia)"
          git push
