<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naturaleza al Día · WWF Colombia</title>
<meta name="description" content="Noticias, fotos y videos de WWF Colombia que se actualizan solos, en español e inglés. / WWF Colombia news, photos and videos, updated automatically, in Spanish and English.">
<meta name="theme-color" content="#04130d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta property="og:title" content="Naturaleza al Día · WWF Colombia">
<meta property="og:description" content="Noticias, fotos y videos de WWF Colombia al día, en español e inglés.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04130d; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.12); --txt:#ecfdf3; --sub:#a7c7b6; --muted:#6f9482;
  --lima:#c6f432; --menta:#3df5a7; --turq:#22d3ee; --coral:#ff7a59; --sol:#ffd23f;
  --r:20px; --disp:"Bricolage Grotesque",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.02em}
img{display:block;max-width:100%}

.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#0d3a27 0%,var(--bg) 60%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;animation:flota 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vw;height:60vw;max-width:520px;max-height:520px;background:#15c27a;top:-15%;left:-20%}
.aurora i:nth-child(2){width:50vw;height:50vw;max-width:440px;max-height:440px;background:#0ea5c6;top:30%;right:-25%;animation-duration:22s}
.aurora i:nth-child(3){width:40vw;height:40vw;max-width:360px;max-height:360px;background:#9bd21a;bottom:-10%;left:10%;animation-duration:26s;opacity:.25}
@keyframes flota{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,6vh) scale(1.15)}100%{transform:translate(-6vw,10vh) scale(.95)}}

.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* Cabecera */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(4,19,13,.75);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:11px 0}
.marca{flex:1;min-width:0}
.marca h1{font-size:19px;line-height:1.1}
.marca h1 span{background:linear-gradient(90deg,var(--lima),var(--menta),var(--turq));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:brillo 6s ease infinite}
.marca small{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vivo{width:8px;height:8px;border-radius:50%;background:var(--menta);animation:late 1.6s infinite;flex:none}
.vivo.busca{background:var(--sol)}
.vivo.off{background:var(--muted);animation:none}
@keyframes late{0%{box-shadow:0 0 0 0 rgba(61,245,167,.7)}70%{box-shadow:0 0 0 9px rgba(61,245,167,0)}100%{box-shadow:0 0 0 0 rgba(61,245,167,0)}}
.idioma{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none;background:var(--card)}
.idioma button{padding:6px 10px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--sub);transition:all .25s}
.idioma button.on{background:var(--txt);color:var(--bg)}
.btn-act{padding:9px 14px;border-radius:999px;background:var(--lima);color:#0b2410;font-weight:800;font-size:13px;flex:none;transition:transform .15s;position:relative;overflow:hidden}
.btn-act:active{transform:scale(.94)}
.btn-act.gira::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:#0b2410;animation:barrita 1s ease-in-out infinite}
@keyframes barrita{0%{left:-40%}100%{left:100%}}
@media (max-width:420px){.marca h1{font-size:17px}.btn-act{padding:9px 11px}}

.cinta{overflow:hidden;border-top:1px solid var(--line);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.cinta div{display:inline-flex;gap:40px;padding:8px 0;white-space:nowrap;animation:corre 70s linear infinite;font-size:13px;color:var(--sub)}
.cinta b{color:var(--lima);font-weight:700;margin-right:6px}
@keyframes corre{to{transform:translateX(-50%)}}

section{display:none;padding:18px 0 8px;animation:entra .45s ease}
section.on{display:block}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.saludo{font-size:clamp(26px,7vw,40px);line-height:1.05;margin:4px 0 6px}
.saludo em{font-style:normal;background:linear-gradient(90deg,var(--lima),var(--menta),var(--turq));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:brillo 6s ease infinite}
@keyframes brillo{50%{background-position:100%}}
.bajada{color:var(--sub);font-size:14.5px;line-height:1.5;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reloj{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tit{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px}
.tit h2{font-size:21px}
.tit small{color:var(--muted);font-size:12px;white-space:nowrap}
.tit h2 .pulso{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--coral);margin-right:8px;vertical-align:middle;animation:late 1.6s infinite}

/* Foto con crédito */
.foto{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f3d2a,#0b2a3a)}
.foto img{width:100%;height:100%;object-fit:cover;transition:transform 6s ease,opacity .6s;opacity:0}
.foto img.ok{opacity:1}
.foto .cred{position:absolute;right:8px;bottom:6px;font-size:10px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.sinfoto{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:44px;color:rgba(255,255,255,.12);letter-spacing:-.03em}

/* Contadores */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{padding:13px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.stat:nth-child(1) b{color:var(--lima)}.stat:nth-child(2) b{color:var(--turq)}.stat:nth-child(3) b{color:var(--coral)}.stat:nth-child(4) b{color:var(--sol)}

.aviso{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(110deg,rgba(198,244,50,.18),rgba(61,245,167,.08));border:1px solid rgba(198,244,50,.35);margin-top:14px}
.aviso .num{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--lima);min-width:34px;text-align:center}
.aviso p{font-size:14px;color:var(--sub)}.aviso p b{color:var(--txt)}

/* Carrusel con fotos reales */
.carrusel{position:relative;height:min(64vw,400px);min-height:280px;border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .foto{position:absolute;inset:0}
.slide.on .foto img.ok{transform:scale(1.08)}
.slide .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 30%,rgba(2,12,8,.92) 100%)}
.slide .txt{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 26px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--lima);color:#0b2410;margin-bottom:10px}
.slide h3{font-size:clamp(20px,5.4vw,28px);line-height:1.15;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.slide p{font-size:14px;color:rgba(255,255,255,.88);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .cred{bottom:auto;top:34px}
.puntos{position:absolute;left:20px;right:20px;top:14px;display:flex;gap:6px;z-index:2}
.puntos i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.puntos i b{display:block;height:100%;width:0;background:#fff}
.puntos i.on b{animation:llena 7s linear forwards}
.puntos i.ya b{width:100%}
@keyframes llena{to{width:100%}}

/* Video */
.video{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#000}
.video .marco{position:relative;aspect-ratio:16/9;cursor:pointer}
.video .marco img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.video .marco:hover img{transform:scale(1.04)}
.video .marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;background:rgba(198,244,50,.95);box-shadow:0 0 0 0 rgba(198,244,50,.6);animation:latePlay 2s infinite}
.play::after{content:"";position:absolute;left:29px;top:22px;border-left:22px solid #0b2410;border-top:15px solid transparent;border-bottom:15px solid transparent}
@keyframes latePlay{70%{box-shadow:0 0 0 18px rgba(198,244,50,0)}100%{box-shadow:0 0 0 0 rgba(198,244,50,0)}}
.video .info{padding:14px 16px;background:var(--card)}
.video .info h3{font-family:Inter;font-size:15.5px;font-weight:700;letter-spacing:0;line-height:1.35}
.video .info span{font-size:12px;color:var(--muted)}
.gvid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.gvid{grid-template-columns:1fr}}

/* Dato y cuenta regresiva */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.tfoto{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:210px;display:flex;flex-direction:column;justify-content:flex-end}
.tfoto>.foto{position:absolute;inset:0}
.tfoto .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(2,12,8,.9))}
.tfoto .cont{position:relative;padding:18px}
.etq{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--lima);margin-bottom:6px}
.tfoto p.grande{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.25}
.dig{display:flex;gap:8px;margin-top:12px}
.dig div{flex:1;text-align:center;padding:8px 4px;border-radius:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.dig b{display:block;font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums}
.dig span{font-size:10.5px;color:var(--sub);text-transform:uppercase}

/* Reto */
.reto{border-color:rgba(61,245,167,.4)}
.reto .etq{color:var(--menta)}
.reto button{margin-top:12px;padding:10px 18px;border-radius:999px;background:var(--menta);color:#05301c;font-weight:800;font-size:14px;transition:transform .15s}
.reto button:active{transform:scale(.93)}
.reto button.hecho{background:rgba(0,0,0,.4);border:1px solid var(--menta);color:var(--menta)}
.racha{font-size:13px;color:var(--sub);margin-left:10px}
.chispa{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:99;animation:vuela 1.1s ease-out forwards}
@keyframes vuela{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}

/* Galería */
.galeria{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.galeria::-webkit-scrollbar{display:none}
.galeria a{flex:none;width:68%;max-width:300px;aspect-ratio:4/5;border-radius:18px;overflow:hidden;scroll-snap-align:start;border:1px solid var(--line)}
.galeria .foto{width:100%;height:100%}
.galeria a:hover img.ok{transform:scale(1.06)}

/* Noticias */
.buscador{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.buscador input{flex:1;background:none;border:0;color:var(--txt);font:inherit;font-size:16px;outline:none;min-width:0}
.buscador input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.lista{display:grid;gap:10px;margin-top:12px}
.nota{display:flex;gap:14px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:transform .2s,background .2s;opacity:0;animation:aparece .5s ease forwards}
.nota:active{transform:scale(.985);background:var(--card2)}
@keyframes aparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nota .foto{width:104px;height:104px;flex:none;border-radius:14px}
.nota .foto .cred{font-size:8.5px;right:4px;bottom:4px;padding:1px 5px}
.nota .sinfoto{font-size:22px}
.vmini .play{width:40px;height:40px;margin:-20px 0 0 -20px}
.vmini .play::after{left:16px;top:12px;border-left-width:12px;border-top-width:8px;border-bottom-width:8px}
.nota h3{font-family:Inter;font-size:15px;font-weight:600;line-height:1.35;letter-spacing:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nota p{font-size:13px;color:var(--sub);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:999px;font-weight:700;font-size:11px}
.tag.wwf{background:rgba(198,244,50,.16);color:var(--lima)}
.tag.prensa{background:rgba(255,122,89,.16);color:var(--coral)}
.tag.nuevo-t{background:var(--lima);color:#0b2410}
.tag.idi{background:rgba(255,255,255,.08);color:var(--sub)}
.vacio{text-align:center;padding:30px 10px;color:var(--sub);line-height:1.5}
.esq{height:128px;border-radius:18px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200%;animation:brillo 1.4s linear infinite}

/* Regiones y frentes con foto */
.region{position:relative;border-radius:22px;min-height:220px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;transition:transform .25s}
.region:active{transform:scale(.98)}
.region>.foto{position:absolute;inset:0}
.region:hover img.ok{transform:scale(1.07)}
.region .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(2,12,8,.92))}
.region .cont{position:relative;padding:18px}
.region h3{font-size:24px}
.region p{font-size:13.5px;color:rgba(255,255,255,.88);margin-top:6px;line-height:1.4}
.region .mas{display:inline-block;font-size:12px;font-weight:800;margin-top:10px;color:var(--lima)}
.frentes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.frentes{grid-template-columns:repeat(2,1fr)}}
.frente{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.frente>.foto{position:absolute;inset:0}
.frente .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(2,12,8,.9))}
.frente b{position:absolute;left:12px;right:12px;bottom:12px;font-family:var(--disp);font-size:16px;line-height:1.15}
.frente:hover img.ok{transform:scale(1.08)}
.frente .cred{display:none}

/* Ayudar */
.accion{display:flex;gap:14px;align-items:center;padding:12px;border-radius:20px;border:1px solid var(--line);background:var(--card);transition:transform .2s}
.accion:active{transform:scale(.98)}
.accion .foto{width:84px;height:84px;border-radius:14px;flex:none}
.accion .foto .cred{display:none}
.accion h3{font-family:Inter;font-size:15.5px;font-weight:700;letter-spacing:0}
.accion p{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.4}
.redes{display:flex;gap:10px;flex-wrap:wrap}
.redes a{padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.compartir{width:100%;margin-top:14px;padding:16px;border-radius:18px;background:linear-gradient(90deg,#25d366,#1ebe5b);color:#05301c;font-weight:800;font-size:16px}

.pie{margin:28px 0 10px;font-size:12px;color:var(--muted);line-height:1.6;text-align:center}
.pie b{color:var(--sub)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(4,19,13,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 4px}
nav button{padding:12px 0;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--muted);transition:all .25s;position:relative}
nav button::before{content:"";position:absolute;left:30%;right:30%;top:3px;height:3px;border-radius:3px;background:var(--lima);transform:scaleX(0);transition:transform .3s}
nav button.on{color:var(--txt);background:var(--card2)}
nav button.on::before{transform:scaleX(1)}
nav button .badge{position:absolute;top:3px;right:6px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;display:none;place-items:center}
nav button .badge.v{display:grid}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;transition:all .35s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.v{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<header>
  <div class="wrap top">
    <div class="marca">
      <h1>Naturaleza <span data-t="alDia">al Día</span></h1>
      <small><i class="vivo busca" id="luz"></i><span id="estado"></span></small>
    </div>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
    <button class="btn-act" id="btnAct" data-t="actualizar">Actualizar</button>
  </div>
  <div class="cinta"><div id="cinta"><span data-t="cargando"></span></div></div>
</header>

<main class="wrap">
  <!-- HOY -->
  <section id="hoy" class="on">
    <h2 class="saludo" id="saludo"></h2>
    <div class="bajada"><span id="fechaHoy"></span><span class="reloj" id="reloj">--:--</span></div>

    <div class="stats">
      <div class="stat"><b data-n="0" id="nWWF">0</b><span data-t="sWWF"></span></div>
      <div class="stat"><b data-n="0" id="nPrensa">0</b><span data-t="sPrensa"></span></div>
      <div class="stat"><b data-n="0" id="nVideos">0</b><span data-t="sVideos"></span></div>
      <div class="stat"><b data-n="0" id="nFotos">0</b><span data-t="sFotos"></span></div>
    </div>
    <div class="aviso" id="novedades"></div>

function pintarReto() {
  const r = leer('nad_reto', { dias: [], racha: 0 }); const hecho = r.dias.includes(hoyCO());
  const btn = $('#btnReto'); btn.textContent = hecho ? t('cumplido') : t('hice'); btn.classList.toggle('hecho', hecho);
  $('#racha').textContent = r.racha ? t('racha', r.racha) : '';
}
$('#btnReto').onclick = e => {
  const r = leer('nad_reto', { dias: [], racha: 0 }); const hoyD = hoyCO();
  if (r.dias.includes(hoyD)) return toast(t('tYaReto'));
  const ayer = new Date(Date.parse(hoyD + 'T12:00:00Z') - 864e5).toISOString().slice(0, 10);
  r.racha = r.dias.includes(ayer) ? r.racha + 1 : 1; r.dias = [...r.dias.slice(-60), hoyD];
  guardar('nad_reto', r); pintarReto(); chispas(e.clientX, e.clientY); toast(t('tReto'));
};
function chispas(x, y) {
  const cols = ['#c6f432', '#3df5a7', '#22d3ee', '#ffd23f', '#ff7a59'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('i'); s.className = 'chispa';
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.background = cols[i % cols.length];
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d - 40 + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}

// ===================== Colombia y Ayudar =====================
let firmaCol = '';
function pintarColombia() {
  const firma = L + galeria().length + Object.keys((DATA.media || {}).paginas || {}).length; if (firma === firmaCol) return; firmaCol = firma;
  $('#regiones').innerHTML = REGIONES.map(r => `<a class="region" href="https://www.wwf.org.co/${r.u}" target="_blank" rel="noopener">${fotoHTML(fotoPara(r.k, r.k), r[L][0])}<div class="velo"></div><div class="cont"><h3>${r[L][0]}</h3><p>${r[L][1]}</p><span class="mas">${t('verWWF')}</span></div></a>`).join('');
  $('#lineas').innerHTML = LINEAS.map(([k, es, en, u]) => `<a class="frente" href="https://www.wwf.org.co/que_hacemos/${u}" target="_blank" rel="noopener">${fotoHTML(fotoPara(k, k), (L === 'es' ? es : en).charAt(0))}<div class="velo"></div><b>${L === 'es' ? es : en}</b></a>`).join('');
  $('#especiales').innerHTML = ESPECIALES.map(([k, es, des, en, den, u]) => fila(k, L === 'es' ? es : en, L === 'es' ? des : den, u)).join('');
}
const fila = (k, n, d, u) => `<a class="accion" href="${u}" target="_blank" rel="noopener">${fotoHTML(fotoPara(k, k + n), n.charAt(0))}<div><h3>${esc(n)}</h3><p>${esc(d)}</p></div></a>`;
let firmaAy = '';
function pintarAyudar() {
  const firma = L + galeria().length + Object.keys((DATA.media || {}).paginas || {}).length; if (firma === firmaAy) return; firmaAy = firma;
  $('#acciones').innerHTML = ACCIONES.map(([k, es, des, en, den, u]) => fila(k, L === 'es' ? es : en, L === 'es' ? des : den, u)).join('');
}
$('#btnComp').onclick = () => {
  const txt = t('shareTxt', location.href.split('#')[0]);
  if (navigator.share) navigator.share({ title: 'Naturaleza al Día', text: txt }).catch(() => {});
  else window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
};

// ===================== Idioma, navegación =====================
function aplicarIdioma() {
  document.documentElement.lang = L;
  $$('[data-t]').forEach(el => { const v = t(el.dataset.t); if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v; });
  $('#q').placeholder = t('buscar');
  $$('.idioma button').forEach(b => b.classList.toggle('on', b.dataset.lang === L));
  firmaC = firmaV = firmaCol = firmaAy = '';
  hoy(); pintarEstado(); pintar();
}
$$('.idioma button').forEach(b => b.onclick = () => { if (L === b.dataset.lang) return; L = b.dataset.lang; guardar('nad_lang', L); aplicarIdioma(); });
function ir(s) {
  $$('section').forEach(x => x.classList.toggle('on', x.id === s));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$$('nav button').forEach(b => b.onclick = () => ir(b.dataset.s));
$$('#filtros .chip').forEach(c => c.onclick = () => { $$('#filtros .chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); filtro = c.dataset.f; pintarLista(); });
$('#q').oninput = pintarLista;
$('#btnAct').onclick = () => { hoy(); enVivo(true); };
let tt; function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('v'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('v'), 2600); }

// ===================== Arranque: "Hoy" se recalcula cada vez que entras =====================
aplicarIdioma(); setInterval(reloj, 1000);
enVivo(false);
setInterval(() => enVivo(false), 10 * 60 * 1000);
let oculto = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) oculto = Date.now(); else if (Date.now() - oculto > 60 * 1000) { hoy(); enVivo(false); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
